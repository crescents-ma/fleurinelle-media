name: Fetch listed images
on:
  workflow_dispatch:
  push:
    paths: ["gen/urls.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          while read -r name url; do
            [ -z "$name" ] && continue
            ext="${url##*.}"; ext="${ext%%\?*}"; [ ${#ext} -gt 4 ] && ext=png
            [ -f "gen/$name.$ext" ] && continue
            curl -sSfL "$url" -o "gen/$name.$ext" && echo "got $name"
          done < gen/urls.txt
      - run: |
          git config user.name "fleurinelle-bot"
          git config user.email "bot@users.noreply.github.com"
          git add gen
          git commit -m "Fetch generated images" || echo "nothing new"
          git push
